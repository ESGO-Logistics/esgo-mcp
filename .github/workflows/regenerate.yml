name: regenerate

# Daily: refresh the bundled spec (the fallback when the live spec cannot be
# loaded) and open a pull request when the contract changed. The server itself
# always uses the live spec first, so users get new endpoints without a release.

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/update_spec.py

      - name: Run tests on the new spec
        id: tests
        continue-on-error: true
        run: python -m pytest -q

      - name: Summarise test result
        id: summary
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "result=Tests pass on the new spec." >> "$GITHUB_OUTPUT"
          else
            echo "result=**Tests fail on the new spec.** Check tests/test_spec.py; a new kind of operation (e.g. a file upload) may need support in src/esgo_mcp/spec.py." >> "$GITHUB_OUTPUT"
          fi

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: spec-update
          delete-branch: true
          add-paths: src/esgo_mcp/openapi.json
          commit-message: "Spec-Update: mitgelieferte openapi.json"
          title: "Spec-Update von api.es-go.de"
          body: |
            The live spec at https://api.es-go.de/v1/openapi.json changed.
            This pull request updates the bundled copy in `src/esgo_mcp/openapi.json`
            (used only when the live spec cannot be loaded at start-up).

            ${{ steps.summary.outputs.result }}

            Pull requests opened by this workflow do not start `test.yml`; the
            test result above comes from this run.
