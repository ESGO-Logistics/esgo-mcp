name: publish

# Runs when a GitHub release is published. Uploads to PyPI via Trusted
# Publishing (pending publisher, no token); the environment "pypi" waits for a reviewer.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Tag must match the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} does not match version $version in pyproject.toml"
            exit 1
          fi

      - run: python -m pip install build twine pip-licenses
      - run: python -m build
      - run: python -m twine check dist/*

      - name: Licenses of runtime dependencies
        # Only the wheel and what it pulls in, exactly what a user installs.
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install dist/*.whl
          python -m piplicenses --python /tmp/check/bin/python --from=mixed --partial-match \
            --allow-only="MIT;BSD;Apache;ISC;PSF;Python Software Foundation" \
            --ignore-packages pip

      - name: Run the tests against the installed wheel
        # pythonpath cleared, so "import esgo_mcp" loads the wheel, not src/.
        run: |
          /tmp/check/bin/python -m pip install pytest
          /tmp/check/bin/python -m pytest -q -p no:cacheprovider -o pythonpath= tests

      - name: The command starts and answers over stdio, like an AI app starts it
        run: /tmp/check/bin/python .github/scripts/smoke_stdio.py /tmp/check/bin/esgo-mcp

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/esgo-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    # Lists the release in the official MCP Registry (registry.modelcontextprotocol.io).
    # Login via GitHub OIDC (namespace io.github.ESGO-Logistics), no secret. The registry
    # checks that the PyPI package exists and that its README contains "mcp-name: <name>".
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Wait until PyPI serves the new version
        run: |
          version=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/esgo-mcp/$version/json" > /dev/null; then exit 0; fi
            sleep 10
          done
          echo "esgo-mcp $version not visible on PyPI after 5 minutes"; exit 1

      - name: Install mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher

      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
